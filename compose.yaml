name: ta3-arduino-uno
services:
  emqx:
    image: emqx/emqx:5.8.9
    hostname: emqx
    environment:
      EMQX_NODE_NAME: emqx@emqx
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:?Ejecuta python3 preparar.py}
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
      - "127.0.0.1:${EMQX_UI_PORT:-18083}:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    restart: unless-stopped
  influxdb:
    image: influxdb:2.7.12
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?Ejecuta python3 preparar.py}
      DOCKER_INFLUXDB_INIT_ORG: ta3
      DOCKER_INFLUXDB_INIT_BUCKET: distancia
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Ejecuta python3 preparar.py}
    ports:
      - "127.0.0.1:${INFLUX_HOST_PORT:-8086}:8086"
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  telegraf:
    image: telegraf:1.36.3
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Ejecuta python3 preparar.py}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      emqx:
        condition: service_started
      influxdb:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Ejecuta python3 preparar.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Ejecuta python3 preparar.py}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
volumes:
  emqx-data:
  emqx-log:
  influx-data:
  influx-config:
  grafana-data:
