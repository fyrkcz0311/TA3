apiVersion: 1
datasources:
  - name: InfluxDB TA3
    uid: ta3-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ta3
      defaultBucket: distancia
      httpMode: POST
    secureJsonData:
      token: $INFLUX_TOKEN
