[agent]
  interval = "10s"
  flush_interval = "5s"
  flush_jitter = "0s"
  metric_batch_size = 100
  metric_buffer_limit = 1000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["iot/raspberrypi/temperatura"]
  qos = 1
  persistent_session = true
  client_id = "ta3-telegraf-arduino"
  name_override = "temperatura"
  data_format = "value"
  data_type = "float"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "ta3"
  bucket = "temperatura"
